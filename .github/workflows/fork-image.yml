name: Fork image

on:
  push:
    tags: ["v*-wd.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag (e.g. 1.2.2-wd.1)"
        required: true

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: "${{ github.actor }}"
          password: "${{ secrets.GITHUB_TOKEN }}"

      - id: tag
        # ref_name for a tag push is already "v1.2.2-wd.1" — strip only the leading "v" so the
        # ghcr tag matches what the add-on's build.yaml pulls ("1.2.2-wd.1").
        run: |
          raw="${{ github.event.inputs.tag || github.ref_name }}"
          echo "tag=${raw#v}" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/matterjs-server/Dockerfile.dev
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/mtflud/matterjs-server:${{ steps.tag.outputs.tag }}
