name: Fork image

on:
  push:
    tags: ["v*-wd.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag (e.g. 1.2.2-wd.1)"
        required: true

permissions:
  contents: read
  packages: write

# Two runs for the same tag (e.g. a tag push racing a manual dispatch) must not race
# concurrent pushes of the same ghcr tag.
concurrency:
  group: fork-image-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4.4.0
        with:
          registry: ghcr.io
          username: "${{ github.actor }}"
          password: "${{ secrets.GITHUB_TOKEN }}"

      - id: tag
        # ref_name for a tag push is already "v1.2.2-wd.1" — strip only the leading "v" so the
        # ghcr tag matches what the add-on's build.yaml pulls ("1.2.2-wd.1"). The raw value goes
        # through env (not inline expansion inside the script) so a crafted dispatch input
        # cannot inject shell code.
        env:
          RAW_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          echo "tag=${RAW_TAG#v}" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/matterjs-server/Dockerfile.dev
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/mtflud/matterjs-server:${{ steps.tag.outputs.tag }}
